services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3001"

  voice-server:
    build: ./voice-server
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3002"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - voice-server

volumes:
  caddy_data:
  caddy_config:
