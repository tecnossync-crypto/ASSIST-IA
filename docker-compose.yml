services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3001"

  voice-server:
    build: ./voice-server
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3002"

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_EMPRESA_ID: ${NEXT_PUBLIC_EMPRESA_ID}
        BACKEND_URL: http://backend:3001
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:3001
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
      - DASHBOARD_DOMAIN=${DASHBOARD_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - voice-server
      - dashboard

volumes:
  caddy_data:
  caddy_config:
