<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Configurar — Plataforma de Voz IA</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 420px;
        margin: 32px auto;
        padding: 0 16px;
        color: #1e293b;
      }
      h1 {
        font-size: 16px;
        margin-bottom: 4px;
      }
      p {
        font-size: 13px;
        color: #64748b;
        line-height: 1.5;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin: 16px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 13px;
      }
      button {
        margin-top: 14px;
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        background: #4f46e5;
        color: white;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #4338ca;
      }
      #mensaje {
        margin-top: 10px;
        font-size: 12px;
        color: #059669;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Plataforma de Voz IA</h1>
    <p>
      Escribe la dirección de tu dashboard (la misma que usas para entrar en el navegador). El botón del ícono
      abrirá el panel de teléfono en una ventana aparte apuntando ahí.
    </p>
    <label for="dashboardUrl">Dirección del dashboard</label>
    <input id="dashboardUrl" type="url" placeholder="https://tu-dominio.com" />
    <button id="guardar">Guardar</button>
    <p id="mensaje">Guardado — ya puedes usar el ícono de la extensión.</p>
    <script src="options.js"></script>
  </body>
</html>
